name: Build AVO Signer Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - feature/avo-signer-android-v0.1
    paths:
      - 'avo-signer/**'
      - '.github/workflows/build-avo-signer.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
        working-directory: avo-signer
      - uses: actions/upload-artifact@v4
        with:
          name: AVO-Signer-Android-V0-1-Debug-APK
          path: avo-signer/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
