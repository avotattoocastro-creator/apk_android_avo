name: Build AVO CHEST V3.7.0 RC2
on:
  workflow_dispatch:
  push:
    branches: [develop/avo-performance-horse]
    paths:
      - 'firmware/chest/V3_7_0_RC2/AVO_CHEST_V3_7_0_RC2_UI_CORRECTED_UNVERIFIED.zip'
      - '.github/workflows/build-chest-v370-rc2.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Verify RC2 source archive exists
        run: |
          set -euo pipefail
          test -s firmware/chest/V3_7_0_RC2/AVO_CHEST_V3_7_0_RC2_UI_CORRECTED_UNVERIFIED.zip || { echo "::error::RC2 source ZIP missing. Upload the actual RC2 archive; never silently substitute RC1/R8."; exit 1; }
      - name: Install ESP32 core
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Extract and validate exact RC2 source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/avo-rc2"
          unzip -q firmware/chest/V3_7_0_RC2/AVO_CHEST_V3_7_0_RC2_UI_CORRECTED_UNVERIFIED.zip -d "$RUNNER_TEMP/avo-rc2"
          cd "$RUNNER_TEMP/avo-rc2"
          grep -q '3.7.0-rc2' lib/avo_core/src/avo_version.h
          python3 verify_source.py
          python3 verify_ota_interlock.py
          for t in tests/test_*.py; do python3 "$t"; done
      - name: Compile ESP32-S3
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/avo-rc2"
          FQBN_VENDOR=esp32 bash build_chest.sh "$GITHUB_WORKSPACE/firmware_out"
      - name: Validate OTA image
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("firmware_out/AVO_CHEST_V3_5_0.ino.bin")
          assert p.is_file() and 100000 < p.stat().st_size < 6291456
          assert p.read_bytes()[0] == 0xe9
          p.rename("firmware_out/AVO_CHEST_V3_7_0_RC2_OTA_UNVERIFIED.bin")
          PY
          sha256sum firmware_out/AVO_CHEST_V3_7_0_RC2_OTA_UNVERIFIED.bin > firmware_out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AVO-CHEST-V3-7-0-RC2-UNVERIFIED
          path: firmware_out/
          if-no-files-found: warn
