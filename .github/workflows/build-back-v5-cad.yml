name: Build AVO BACK V5 CASCO CAD (STEP/STL)

# Cápsula estanca (base, tapa, junta) y base magnética del casco. Solo en la rama de la espalda del casco.
on:
  workflow_dispatch:
  push:
    branches: [feature/back-v5-casco]
    paths:
      - 'hardware/back/V5_CASCO/CAD/avo_casco_v5.py'
      - 'hardware/back/V5_CASCO/PCB/pcb_mecanica.json'
      - '.github/workflows/build-back-v5-cad.yml'

permissions:
  contents: write

concurrency:
  group: back-v5-cad-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cad:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CadQuery
        run: pip install cadquery==2.4.0 "numpy<2"
      - name: Build
        working-directory: hardware/back/V5_CASCO/CAD
        run: |
          set -o pipefail
          if ! python avo_casco_v5.py 2>&1 | tee build.log; then
            tail -25 build.log | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
            exit 1
          fi
      - name: Commit outputs
        run: |
          git config user.name "avo-cad-bot"; git config user.email "avo-cad-bot@users.noreply.github.com"
          git add hardware/back/V5_CASCO/CAD/out hardware/back/V5_CASCO/CAD/build.log
          git commit -m "CAD casco V5: STEP/STL generados [skip ci]" || echo "sin cambios"
          git pull --rebase -q origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }}
