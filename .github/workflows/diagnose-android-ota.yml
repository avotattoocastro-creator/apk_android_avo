name: Diagnose Android V1.9 OTA authorization gate
on:
  workflow_dispatch:
  push:
    branches: [develop/avo-performance-horse]
    paths:
      - '.github/workflows/diagnose-android-ota.yml'
permissions:
  contents: read
jobs:
  ota-source-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Locate OTA_AUTH and blocked installation logic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          {
            echo "AVO Android OTA source audit"
            echo "Commit: $GITHUB_SHA"
            echo "Relevant source files:"
            rg -l 'OTA_AUTH|Autorización recibida|Falta OTA_AUTH|Firmware listo para instalar|Comprobar firma válida|anti-rollback|Sincronización de entrenamientos' app core || true
            echo "Relevant source lines:"
            rg -n 'OTA_AUTH|Autorización recibida|Falta OTA_AUTH|Firmware listo para instalar|Comprobar firma válida|anti-rollback|Sincronización de entrenamientos' app core || true
          } | tee out/ota-source-audit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AVO-Android-V1-9-OTA-Source-Audit
          path: out/ota-source-audit.txt
