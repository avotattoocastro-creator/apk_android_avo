name: Build AVO USB Updater
on:
  workflow_dispatch:
  push:
    branches: [develop/avo-performance-horse, feature/avo-usb-updater]
    paths: ['usb-updater/**', '.github/workflows/build-usb-updater.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew -p usb-updater --no-daemon :app:assembleDebug
      - name: Collect APK and checksum
        run: |
          mkdir -p out
          cp usb-updater/app/build/outputs/apk/debug/app-debug.apk out/AVO_Performance_Horse_Update_V1_4_debug.apk
          cd out && sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AVO-Performance-Horse-Update-V1-4-DEBUG
          path: out/
          retention-days: 30
