name: AVO Windows - build and self-tests
on:
  push:
    branches:
      - 'feature/windows-advanced-analysis'
      - 'develop/avo-performance-horse'
    paths:
      - 'windows/**'
      - '.github/workflows/build-avo-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run real format interoperability tests
        run: dotnet run --project windows/AVO.Windows.SelfTest/AVO.Windows.SelfTest.csproj -c Release
      - name: Compile WPF and publish standalone Windows x64
        run: dotnet publish windows/AVO.Windows/AVO.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o windows/publish
      - name: Archive Windows application
        shell: pwsh
        run: Compress-Archive -Path windows/publish/* -DestinationPath windows/AVO_Windows_V1_x64.zip -Force
      - name: Publish portable EXE bundle
        uses: actions/upload-artifact@v4
        with:
          name: AVO-Windows-V1-x64
          path: windows/AVO_Windows_V1_x64.zip
          if-no-files-found: error
          retention-days: 30
