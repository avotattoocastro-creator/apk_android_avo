name: Existencias JLCPCB (cincha)

# Consulta existencias, precio y tipo (Basic/Extended) de las piezas de la cincha desde el runner.
on:
  workflow_dispatch:
  push:
    branches: [feature/avo-girth-pcb]
    paths:
      - 'hardware/girth/PCB/fuente/stock_jlc.py'
      - 'hardware/girth/PCB/fuente/stock_lista.txt'
      - '.github/workflows/jlc-stock-girth.yml'

permissions:
  contents: write

concurrency:
  group: girth-stock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Consulta
        working-directory: hardware/girth/PCB
        run: |
          mkdir -p out_stock
          python3 fuente/stock_jlc.py out_stock $(grep -v '^#' fuente/stock_lista.txt | tr '\n' ' ') | tee out_stock/stock.log
      - name: Guardar en la rama
        run: |
          git config user.name "avo-cad-bot"; git config user.email "avo-cad-bot@users.noreply.github.com"
          T=$(mktemp -d); cp -r hardware/girth/PCB/out_stock $T/
          git fetch origin ${{ github.ref_name }}; git reset -q --hard origin/${{ github.ref_name }}
          rm -rf hardware/girth/PCB/out_stock; cp -r $T/out_stock hardware/girth/PCB/
          git add -A hardware/girth/PCB/out_stock
          git commit -m "Cincha: existencias JLCPCB consultadas en el CI [skip ci]" || echo "sin cambios"
          git push origin HEAD:${{ github.ref_name }}
