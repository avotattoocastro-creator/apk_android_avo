name: Build AVO GIRTH V0.3.0 (placa REV B ESP32-C3)

on:
  workflow_dispatch:
  push:
    branches: [feature/avo-girth-pcb]
    paths:
      - 'firmware/girth/V0_3_0_C3/AVO_GIRTH_V0_3_0/**'
      - 'firmware/girth/V0_3_0_C3/build_girth_c3.sh'
      - 'firmware/girth/V0_3_0_C3/*.md'
      - 'firmware/back/V3_8_0/lib/avo_core/**'
      - '.github/workflows/build-girth-c3.yml'

permissions:
  contents: write

concurrency:
  group: girth-c3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  girth:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: firmware/girth/V0_3_0_C3
    steps:
      - uses: actions/checkout@v4
      - name: Pruebas en el PC de la librería del enlace (incluye el lado de la espalda)
        working-directory: firmware/back/V3_8_0
        run: |
          g++ -std=c++17 -O1 -Wall -Ilib/avo_core/src test/test_espnow.cpp lib/avo_core/src/*.cpp -o back_test
          ./back_test
      - uses: arduino/setup-arduino-cli@v2
      - name: Núcleo ESP32 3.3.12
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Compilar
        run: |
          rm -rf out && mkdir -p out
          if ! ./build_girth_c3.sh "$PWD/out/bin"; then
            grep -E "error:|Error " out/bin/build.log | head -30 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
            exit 1
          fi
      - name: Comprobar imágenes y empaquetar
        run: |
          cd out/bin
          cp AVO_GIRTH_V0_3_0.ino.bin AVO_GIRTH_V0_3_0_C3_app.bin
          cp AVO_GIRTH_V0_3_0.ino.merged.bin AVO_GIRTH_V0_3_0_C3_COMPLETO.bin
          python3 - <<'PY'
          import struct, sys
          m = open("AVO_GIRTH_V0_3_0_C3_COMPLETO.bin", "rb").read()
          a = open("AVO_GIRTH_V0_3_0_C3_app.bin", "rb").read()
          tail = m[0x10000 + len(a):]
          if tail and tail.count(0xFF) != len(tail): print("::error title=Imagen::datos tras la app"); sys.exit(1)
          m = m[:0x10000 + len(a)]
          open("AVO_GIRTH_V0_3_0_C3_COMPLETO.bin", "wb").write(m)
          ents = []
          for i in range(0x8000, 0x9000, 32):
              e = m[i:i+32]
              if e[:2] != b"\xaa\x50": break
              ents.append((e[2], e[3], hex(struct.unpack("<I", e[4:8])[0]), hex(struct.unpack("<I", e[8:12])[0]), e[12:28].split(b"\0")[0].decode()))
          print(f"::notice title=Particiones::{ents}")
          errs = []
          # chip id en la cabecera de imagen de ESP-IDF: 5 = ESP32-C3
          if not (m[0] == 0xE9 and struct.unpack("<H", m[12:14])[0] == 5): errs.append("el cargador en 0x0 no es de ESP32-C3")
          if m[0x8000:0x8002] != b"\xaa\x50": errs.append("no hay tabla de particiones en 0x8000")
          app0 = [e for e in ents if e[0] == 0 and e[1] == 0x10]
          if not app0 or app0[0][2] != "0x10000": errs.append("ota_0 debe empezar en 0x10000")
          if not any(e[0] == 0 and e[1] == 0x11 for e in ents): errs.append("falta la segunda ranura OTA")
          if m[0x10000:0x10000 + len(a)] != a: errs.append("la imagen completa no contiene la app en 0x10000")
          if not (a[0] == 0xE9 and struct.unpack("<H", a[12:14])[0] == 5 and b"0.3.0\x00AVO-GIRTH" in a): errs.append("marca de la app / chip")
          for e in errs: print(f"::error title=Imagen::{e}")
          if errs: sys.exit(1)
          print(f"::notice title=AVO GIRTH 0.3.0::ESP32-C3 OK, app {len(a)} bytes, imagen completa {len(m)} bytes")
          PY
          sha256sum AVO_GIRTH_V0_3_0_C3_*.bin > SHA256SUMS.txt
          grep -E 'Sketch uses|Global variables' build.log | tee memoria.txt
          cd ../..
          mkdir -p out/zip/fuentes
          cp out/bin/AVO_GIRTH_V0_3_0_C3_app.bin out/bin/AVO_GIRTH_V0_3_0_C3_COMPLETO.bin out/bin/SHA256SUMS.txt out/bin/memoria.txt out/zip/
          cp out/bin/build.log out/zip/compilacion.log
          cp -r AVO_GIRTH_V0_3_0 build_girth_c3.sh out/zip/fuentes/
          rm -rf out/zip/fuentes/AVO_GIRTH_V0_3_0/build
          cp *.md out/zip/ 2>/dev/null || true
          cp ../../back/V3_8_0/lib/avo_core/src/avo_girth_link.h ../../back/V3_8_0/lib/avo_core/src/avo_payloads.h out/zip/fuentes/
          (cd out/zip && zip -qr ../AVO_GIRTH_PCB_C3_FIRMWARE.zip .)
          rm -rf out/zip out/bin/*.elf out/bin/*.map out/bin/*.bin
          ls -la out
      - name: Guardar en la rama
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "avo-cad-bot"; git config user.email "avo-cad-bot@users.noreply.github.com"
          F=firmware/girth/V0_3_0_C3
          T=$(mktemp -d); cp -r $F/out $T/out 2>/dev/null || mkdir -p $T/out
          git fetch origin ${{ github.ref_name }}; git reset -q --hard origin/${{ github.ref_name }}
          rm -rf $F/out; cp -r $T/out $F/out
          git add -A $F/out
          git commit -m "Cincha V0.3.0 ESP32-C3: compilación del CI de ${GITHUB_SHA::7} [skip ci]" || echo "sin cambios"
          git push origin HEAD:${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AVO-GIRTH-V0-3-0-ESP32C3
          path: firmware/girth/V0_3_0_C3/out
