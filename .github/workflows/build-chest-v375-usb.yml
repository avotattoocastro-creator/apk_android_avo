name: Build AVO CHEST V3.7.5-usb1 (rc5 + descarga al PC por USB)
on:
  workflow_dispatch:
  push:
    branches: [feature/chest-usb-pc-sync, feature/avo-wifi-sync]
    paths:
      - 'firmware/chest/V3_7_3_READFILE/**'
      - 'firmware/chest/V3_7_4_WIFI/**'
      - 'firmware/chest/V3_7_5_RAM/**'
      - 'firmware/chest/V3_7_5_USB/**'
      - 'windows/AVO.Windows.SelfTest/usb_transcript.json'
      - 'firmware/chest/V3_7_2_UI/**'
      - '.github/workflows/build-chest-v375-usb.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Prepare 3.7.2-rc1 sources (RC2 base + new UI)
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/avo-375usb"
          mkdir -p "$D"
          unzip -q firmware/chest/V3_7_0_RC2/AVO_CHEST_V3_7_0_RC2_UI_CORRECTED_UNVERIFIED.zip -d "$D"
          (cd "$D" && python3 "$GITHUB_WORKSPACE/firmware/chest/V3_7_2_UI/tools/apply_v372.py")
          cp firmware/chest/V3_7_2_UI/src/* "$D/AVO_CHEST_V3_5_0/src/"
          cp firmware/chest/V3_7_2_UI/tests_test_ui_v372.py "$D/tests/test_ui_v372.py"
          (cd "$D" && python3 "$GITHUB_WORKSPACE/firmware/chest/V3_7_3_READFILE/tools/apply_v373.py")
          cp firmware/chest/V3_7_3_READFILE/tests_test_readfile_v373.py "$D/tests/test_readfile_v373.py"
          cp firmware/chest/V3_7_4_WIFI/src/* "$D/AVO_CHEST_V3_5_0/src/"
          (cd "$D" && python3 "$GITHUB_WORKSPACE/firmware/chest/V3_7_4_WIFI/tools/apply_v374.py")
          cp firmware/chest/V3_7_4_WIFI/tests_test_wifi_v374.py "$D/tests/test_wifi_v374.py"
          (cd "$D" && python3 "$GITHUB_WORKSPACE/firmware/chest/V3_7_5_RAM/tools/apply_v375.py")
          cp firmware/chest/V3_7_5_RAM/tests_test_ram_v375.py "$D/tests/test_ram_v375.py"
          # V3.7.5-usb1: download to the PC over USB (Windows app)
          cp firmware/chest/V3_7_5_USB/src/* "$D/AVO_CHEST_V3_5_0/src/"
          (cd "$D" && python3 "$GITHUB_WORKSPACE/firmware/chest/V3_7_5_USB/tools/apply_v375_usb.py")
          cp firmware/chest/V3_7_5_USB/tests_test_usb_v375.py "$D/tests/test_usb_v375.py"
          cp firmware/chest/V3_7_5_USB/host/usb_host.cpp "$D/tests/usb_host.cpp"
          cd "$D"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/avo_core/src/avo_version.h')
          s = p.read_text()
          assert '#define AVO_FW_VERSION "3.7.0-rc2"' in s and '#define AVO_FW_VERSION_NUM 0x030700' in s
          s = s.replace('"3.7.0-rc2"', '"3.7.5-usb1"').replace('0x030700', '0x030705')
          p.write_text(s)
          PY
          grep -n "AVO_FW_VERSION" lib/avo_core/src/avo_version.h
      - name: Static source checks and Python tests
        env:
          AVO_USB_TRANSCRIPT: ${{ github.workspace }}/windows/AVO.Windows.SelfTest/usb_transcript.json
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/avo-375usb"
          python3 verify_source.py
          python3 verify_ota_interlock.py
          for t in tests/test_*.py; do python3 "$t"; done
      - name: Preview of the "CONECTADO AL PC" screen (same C++ drawing code, simulated panel)
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/avo-375usb"
          mkdir -p ui_preview_pc
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Wno-unused-parameter \
            -I "$D/AVO_CHEST_V3_5_0/src" -I "$D/lib/avo_core/src" \
            firmware/chest/V3_7_5_USB/host/pc_preview.cpp "$D/AVO_CHEST_V3_5_0/src/ui_fb.cpp" "$D/AVO_CHEST_V3_5_0/src/ui_dash.cpp" \
            -o pc_preview
          ./pc_preview ui_preview_pc
          python3 -m pip install --quiet pillow
          python3 -c "
          from PIL import Image; import glob
          for p in glob.glob('ui_preview_pc/*.ppm'): Image.open(p).save(p[:-4] + '.png')
          "
          rm ui_preview_pc/*.ppm
      - uses: actions/upload-artifact@v4
        with:
          name: AVO-CHEST-V3-7-5-USB1-PANTALLA-PC-PREVIEW
          path: ui_preview_pc/
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 3.3.12
        run: |
          set -euo pipefail
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Compile firmware
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/avo-375usb"
          if ! FQBN_VENDOR=esp32 bash build_chest.sh "$GITHUB_WORKSPACE/firmware_out"; then
            # Surface compiler errors as annotations (readable without downloading logs).
            grep -E "error:|Error " "$GITHUB_WORKSPACE/firmware_out/build.log" | head -20 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
            exit 1
          fi
          grep -E "Sketch uses|Global variables" "$GITHUB_WORKSPACE/firmware_out/build.log" | while IFS= read -r l; do echo "::notice::$l"; done
      - name: Check image and label unverified
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('firmware_out/AVO_CHEST_V3_5_0.ino.bin')
          b = p.read_bytes()
          assert p.is_file() and 100000 < len(b) < 6291456, len(b)
          assert b[0] == 0xE9 and b[12] == 9, 'not an ESP32-S3 app image'
          i = b.find(b'3.7.5-usb1\x00')
          assert i >= 0 and b.find(b'AVO-CHEST\x00', i) - i < 32, 'AVO version string missing'
          p.rename('firmware_out/AVO_CHEST_V3_7_5_USB1_UNVERIFIED.bin')
          PY
          cd firmware_out && sha256sum AVO_CHEST_V3_7_5_USB1_UNVERIFIED.bin > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AVO-CHEST-V3-7-5-USB1-UNVERIFIED
          path: firmware_out/
          if-no-files-found: warn
