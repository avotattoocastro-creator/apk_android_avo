name: Centro Multimedia - TestFlight

# App personal «Centro Multimedia» (código en el repositorio público avotattoocastro-creator/centro-multimedia).
# Vive aquí solo para reutilizar los secretos de App Store Connect de la app iPad de AVO, con el mismo sistema que
# build-avo-ipad.yml (Xcode 26, archivo sin firmar y firma en la nube de Apple al exportar).
# No toca la app iPad de AVO, su bundle id ni su número de build. Se lanza con push a esta rama o a mano.
on:
  push:
    branches:
      - 'tarea/centro-multimedia-testflight'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: centro-multimedia-testflight
  cancel-in-progress: false
env:
  CM_BUNDLE_ID: org.avoperformance.centromultimedia
  CM_APP_NAME: Centro Multimedia
  CM_BUILD_NUMBER: ${{ github.run_number }}
jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Comprobar secretos
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || { [ -z "$ASC_KEY_P8_BASE64" ] && [ -z "$ASC_KEY_P8" ]; } || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::Faltan los secretos de App Store Connect."; exit 1
          fi

      - name: Descargar Centro Multimedia
        uses: actions/checkout@v4
        with:
          repository: avotattoocastro-creator/centro-multimedia
          ref: main
          path: cm

      - name: Xcode 26, proyecto y clave API
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1); [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version
          brew install xcodegen >/dev/null
          cd cm
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER: .*/PRODUCT_BUNDLE_IDENTIFIER: $CM_BUNDLE_ID/" project.yml
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$CM_BUILD_NUMBER\"/" project.yml
          xcodegen generate
          cd ..
          mkdir -p ~/private_keys
          if [ -n "$ASC_KEY_P8" ]; then printf '%s' "$ASC_KEY_P8" > /tmp/key_raw.txt
          else echo "$ASC_KEY_P8_BASE64" | base64 --decode > /tmp/key_raw.txt; fi
          python3 - "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" <<'PY'
          import re, sys, base64
          raw = open('/tmp/key_raw.txt', encoding='utf-8', errors='ignore').read()
          body = re.sub(r'-----(BEGIN|END) PRIVATE KEY-----', '', raw)
          body = re.sub(r'[^A-Za-z0-9+/=]', '', body)
          der = base64.b64decode(body)
          b64 = base64.b64encode(der).decode()
          pem = '-----BEGIN PRIVATE KEY-----\n' + '\n'.join(b64[i:i+64] for i in range(0, len(b64), 64)) + '\n-----END PRIVATE KEY-----\n'
          open(sys.argv[1], 'w').write(pem)
          print('Clave .p8 normalizada:', len(der), 'bytes DER')
          PY
          rm -f /tmp/key_raw.txt

      - name: Registrar el bundle id y comprobar la app en App Store Connect
        run: |
          python3 -m venv /tmp/asc && /tmp/asc/bin/pip -q install pyjwt cryptography requests
          /tmp/asc/bin/python - <<'PY'
          import os, time, jwt, requests, sys
          kid, iss, bid = os.environ['ASC_KEY_ID'], os.environ['ASC_ISSUER_ID'], os.environ['CM_BUNDLE_ID']
          key = open(os.path.expanduser(f'~/private_keys/AuthKey_{kid}.p8')).read()
          tok = jwt.encode({'iss': iss, 'iat': int(time.time()), 'exp': int(time.time()) + 1100, 'aud': 'appstoreconnect-v1'},
                           key, algorithm='ES256', headers={'kid': kid, 'typ': 'JWT'})
          H = {'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json'}
          A = 'https://api.appstoreconnect.apple.com/v1'
          r = requests.get(f'{A}/bundleIds', params={'filter[identifier]': bid}, headers=H)
          print('bundleIds', r.status_code)
          if r.ok and not [d for d in r.json()['data'] if d['attributes']['identifier'] == bid]:
              c = requests.post(f'{A}/bundleIds', headers=H, json={'data': {'type': 'bundleIds', 'attributes': {
                  'identifier': bid, 'name': os.environ['CM_APP_NAME'], 'platform': 'IOS'}}})
              print('Registro del bundle id:', c.status_code, c.text[:300])
          else:
              print('El bundle id ya existe o no se pudo consultar:', r.text[:200])
          a = requests.get(f'{A}/apps', params={'filter[bundleId]': bid}, headers=H)
          print('apps', a.status_code)
          if a.ok and not a.json()['data']:
              print(f"::error title=Falta la app en App Store Connect::Crea la app: App Store Connect › Apps › + › Nueva app › iOS › nombre «{os.environ['CM_APP_NAME']}» › Bundle ID {bid} › SKU centromultimedia. Después vuelve a lanzar este workflow.")
              sys.exit(1)
          if a.ok:
              print('App encontrada:', a.json()['data'][0]['attributes']['name'])
          PY

      - name: Archivar (sin firmar; se firma al exportar)
        working-directory: cm
        run: |
          set -o pipefail
          xcodebuild archive -project CentroMultimedia.xcodeproj -scheme CentroMultimedia -configuration Release \
            -destination 'generic/platform=iOS' -archivePath ../build/CentroMultimedia.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee ../archive.log | tail -30
          test -d ../build/CentroMultimedia.xcarchive || { grep -n "error:" ../archive.log | head -40; exit 1; }

      - name: Subir a TestFlight
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive -archivePath build/CentroMultimedia.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee export.log | tail -40
          grep -q "EXPORT SUCCEEDED\|Upload succeeded\|Uploaded" export.log || { grep -iE "error" export.log | head -30; exit 1; }
          echo "::notice::Centro Multimedia, compilación $CM_BUILD_NUMBER enviada a TestFlight ($CM_BUNDLE_ID)."

      - name: Borrar la clave
        if: always()
        run: rm -rf ~/private_keys
