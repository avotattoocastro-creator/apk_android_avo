name: Existencias JLCPCB (espalda V5 casco)

# Consulta existencias, precio y tipo (Basic/Extended) de las piezas candidatas de la placa AVO BACK V5 CASCO.
on:
  workflow_dispatch:
  push:
    branches: [feature/back-v5-casco]
    paths:
      - 'hardware/back/V5_CASCO/PCB/fuente/stock_jlc.py'
      - 'hardware/back/V5_CASCO/PCB/fuente/stock_lista.txt'
      - '.github/workflows/jlc-stock-back-v5.yml'

permissions:
  contents: write

concurrency:
  group: back-v5-stock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Consulta
        working-directory: hardware/back/V5_CASCO/PCB
        run: |
          mkdir -p out_stock
          python3 fuente/stock_jlc.py out_stock --list fuente/stock_lista.txt | tee out_stock/stock.log
      - name: Guardar en la rama
        run: |
          git config user.name "avo-cad-bot"; git config user.email "avo-cad-bot@users.noreply.github.com"
          T=$(mktemp -d); cp -r hardware/back/V5_CASCO/PCB/out_stock $T/
          git fetch origin ${{ github.ref_name }}; git reset -q --hard origin/${{ github.ref_name }}
          rm -rf hardware/back/V5_CASCO/PCB/out_stock; cp -r $T/out_stock hardware/back/V5_CASCO/PCB/
          git add -A hardware/back/V5_CASCO/PCB/out_stock
          git commit -m "Espalda V5 casco: existencias JLCPCB consultadas en el CI [skip ci]" || echo "sin cambios"
          git push origin HEAD:${{ github.ref_name }}
