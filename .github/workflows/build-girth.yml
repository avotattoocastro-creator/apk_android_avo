name: Build AVO GIRTH V0.1.0 (cincha ESP32-C6)

on:
  workflow_dispatch:
  push:
    branches: [develop/avo-performance-horse, feature/avo-wifi-sync]
    paths:
      - 'firmware/girth/**'
      - 'firmware/back/V3_8_0/lib/avo_core/**'
      - '.github/workflows/build-girth.yml'

permissions:
  contents: read

jobs:
  girth:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: firmware/girth/V0_1_0
    steps:
      - uses: actions/checkout@v4
      - name: Host tests of the shared link library (girth hub included)
        working-directory: firmware/back/V3_8_0
        run: |
          g++ -std=c++17 -O1 -Wall -Ilib/avo_core/src test/test_espnow.cpp lib/avo_core/src/*.cpp -o back_test
          ./back_test
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core 3.3.12
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Build firmware
        run: |
          if ! ./build_girth.sh "$GITHUB_WORKSPACE/out"; then
            grep -E "error:|Error " "$GITHUB_WORKSPACE/out/build.log" | head -20 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
            exit 1
          fi
      - name: Package
        run: |
          cd "$GITHUB_WORKSPACE/out"
          ls -la
          echo "::notice title=Archivos::$(ls | tr '\n' ' ')"
          cp AVO_GIRTH_V0_1_0.ino.bin AVO_GIRTH_V0_1_0_app.bin
          cp AVO_GIRTH_V0_1_0.ino.merged.bin AVO_GIRTH_V0_1_0_COMPLETO.bin
          python3 - <<'PY'
          import struct, sys
          m = open("AVO_GIRTH_V0_1_0_COMPLETO.bin", "rb").read()
          a = open("AVO_GIRTH_V0_1_0_app.bin", "rb").read()
          # the core pads the merged image to the whole flash: keep it up to the end of the app (rest must be 0xFF)
          tail = m[0x10000 + len(a):]
          if tail and tail.count(0xFF) != len(tail): print("::error title=Imagen::datos tras la app en la imagen completa"); sys.exit(1)
          m = m[:0x10000 + len(a)]
          open("AVO_GIRTH_V0_1_0_COMPLETO.bin", "wb").write(m)
          ents = []
          for i in range(0x8000, 0x9000, 32):
              e = m[i:i+32]
              if e[:2] != b"\xaa\x50": break
              ents.append((e[2], e[3], hex(struct.unpack("<I", e[4:8])[0]), hex(struct.unpack("<I", e[8:12])[0]), e[12:28].split(b"\0")[0].decode()))
          print(f"::notice title=Particiones::{ents}")
          errs = []
          if not (m[0] == 0xE9 and struct.unpack("<H", m[12:14])[0] == 13): errs.append("bootloader at 0x0 is not ESP32-C6")
          if m[0x8000:0x8002] != b"\xaa\x50": errs.append("no partition table at 0x8000")
          app0 = [e for e in ents if e[0] == 0 and e[1] == 0x10]
          if not app0 or app0[0][2] != "0x10000": errs.append("ota_0 must start at 0x10000")
          if not any(e[0] == 0 and e[1] == 0x11 for e in ents): errs.append("second OTA slot missing")
          if m[0x10000:0x10000 + len(a)] != a: errs.append("merged image does not contain the app at 0x10000")
          if len(m) != 0x10000 + len(a): errs.append(f"merged size {hex(len(m))} != 0x10000 + app {hex(len(a))}")
          if not (a[0] == 0xE9 and struct.unpack("<H", a[12:14])[0] == 13 and b"0.1.0\x00AVO-GIRTH" in a): errs.append("app marker / chip")
          for e in errs: print(f"::error title=Imagen::{e}")
          if errs: sys.exit(1)
          print(f"::notice title=AVO GIRTH 0.1.0::ESP32-C6 OK, app {len(a)} bytes, imagen completa {len(m)} bytes, ota_0 0x10000")
          PY
          sha256sum AVO_GIRTH_V0_1_0_*.bin > SHA256SUMS.txt
          echo "::notice title=Memoria::$(grep -E 'Sketch uses|Global variables' build.log | tr '\n' ' ')"
      - uses: actions/upload-artifact@v4
        with:
          name: AVO-GIRTH-V0-1-0-ESP32C6
          path: |
            out/AVO_GIRTH_V0_1_0_*.bin
            out/SHA256SUMS.txt
            out/build.log
          if-no-files-found: error
          retention-days: 60
