name: Audit AVO CHEST partitions and build metadata
on:
  workflow_dispatch:
  push:
    branches: [develop/avo-performance-horse]
    paths: ['.github/workflows/audit-chest-partitions.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract firmware sources and build configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/source audit/report
          unzip -q firmware/chest/V3_5_4/AVO_CHEST_V3_5_4_SD_FIX_SOURCES.zip -d audit/source
          python3 - <<'PY'
          from pathlib import Path
          root=Path("audit/source")
          out=Path("audit/report")
          files=[]
          for p in root.rglob("*"):
              if not p.is_file(): continue
              name=p.name.lower()
              if name in ("platformio.ini","sdkconfig","sdkconfig.defaults","partitions.csv","build_chest.sh","boards.txt") or "partition" in name or name.endswith(".json") and "board" in str(p).lower():
                  files.append(p)
          with (out/"SOURCE_INVENTORY.txt").open("w") as f:
              for p in sorted(root.rglob("*")):
                  if p.is_file(): f.write(str(p.relative_to(root))+"\n")
          with (out/"PARTITION_AUDIT.txt").open("w") as f:
              f.write("Historical V3.5.4 sources ONLY; not verified for V3.7.1\n")
              for p in files:
                  f.write("\n### "+str(p.relative_to(root))+"\n")
                  try: f.write(p.read_text(errors="replace")[:20000]+"\n")
                  except Exception as e: f.write(str(e)+"\n")
          PY
          find audit/source -type f \( -name '*partition*.bin' -o -name '*bootloader*.bin' -o -name 'flasher_args.json' -o -name 'flash_args' \) -exec cp --parents {} audit/report/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: AVO-CHEST-HISTORICAL-PARTITION-AUDIT
          path: audit/report/
          retention-days: 30
