name: Existencias JLCPCB (cincha PCB REV D)

# Consulta existencias, precio y tipo (Basic/Extended) de las piezas candidatas de la placa AVO GIRTH REV D.
on:
  workflow_dispatch:
  push:
    branches: [feature/girth-pcb-rev-d]
    paths:
      - 'hardware/girth/PCB_REV_D/fuente/stock_jlc.py'
      - 'hardware/girth/PCB_REV_D/fuente/stock_lista.txt'
      - '.github/workflows/jlc-stock-girth-revd.yml'

permissions:
  contents: write

concurrency:
  group: girth-revd-stock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Consulta
        working-directory: hardware/girth/PCB_REV_D
        run: |
          mkdir -p out_stock
          python3 fuente/stock_jlc.py out_stock --list fuente/stock_lista.txt | tee out_stock/stock.log
      - name: Guardar en la rama
        run: |
          git config user.name "avo-cad-bot"; git config user.email "avo-cad-bot@users.noreply.github.com"
          T=$(mktemp -d); cp -r hardware/girth/PCB_REV_D/out_stock $T/
          git fetch origin ${{ github.ref_name }}; git reset -q --hard origin/${{ github.ref_name }}
          rm -rf hardware/girth/PCB_REV_D/out_stock; cp -r $T/out_stock hardware/girth/PCB_REV_D/
          git add -A hardware/girth/PCB_REV_D/out_stock
          git commit -m "Cincha PCB REV D: existencias JLCPCB consultadas en el CI [skip ci]" || echo "sin cambios"
          git push origin HEAD:${{ github.ref_name }}
