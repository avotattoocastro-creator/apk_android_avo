name: Build AVO Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, feature/android-v1-4-ota-pecho]
    paths:
      - 'AVO_ANDROID_V1_0_FUENTES_PARA_GITHUB.zip'
      - 'AVO_ANDROID_V1_1_FUENTES_PARA_GITHUB.zip'
      - 'AVO_ANDROID_V3_5_0_FUENTES_GITHUB.zip'
      - 'AVO_ANDROID_V1_2_ANALISIS_COMPLETO_FUENTES.zip'
      - 'AVO_ANDROID_V1_3_DISPOSITIVOS_FUENTES.zip'
      - 'AVO_ANDROID_V1_4_OTA_PECHO_SEGURIDAD_FUENTES.zip'
      - 'AVO_ANDROID_V1_5_OTA_PECHO_EXPERIMENTAL_FUENTES.zip'
      - 'app/**'
      - 'core/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
      - 'build.gradle'
      - 'build.gradle.kts'
      - 'settings.gradle'
      - 'settings.gradle.kts'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f app/build.gradle.kts ] || [ -f app/build.gradle ]; then
            echo "AVO_SOURCE_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          elif [ -f AVO_ANDROID_V1_5_OTA_PECHO_EXPERIMENTAL_FUENTES.zip ]; then
            mkdir -p "$RUNNER_TEMP/avo-android"
            unzip -q AVO_ANDROID_V1_5_OTA_PECHO_EXPERIMENTAL_FUENTES.zip -d "$RUNNER_TEMP/avo-android"
            echo "AVO_SOURCE_DIR=$RUNNER_TEMP/avo-android" >> "$GITHUB_ENV"
          elif [ -f AVO_ANDROID_V1_4_OTA_PECHO_SEGURIDAD_FUENTES.zip ]; then
            mkdir -p "$RUNNER_TEMP/avo-android"
            unzip -q AVO_ANDROID_V1_4_OTA_PECHO_SEGURIDAD_FUENTES.zip -d "$RUNNER_TEMP/avo-android"
            echo "AVO_SOURCE_DIR=$RUNNER_TEMP/avo-android" >> "$GITHUB_ENV"
          elif [ -f AVO_ANDROID_V1_3_DISPOSITIVOS_FUENTES.zip ]; then
            mkdir -p "$RUNNER_TEMP/avo-android"
            unzip -q AVO_ANDROID_V1_3_DISPOSITIVOS_FUENTES.zip -d "$RUNNER_TEMP/avo-android"
            echo "AVO_SOURCE_DIR=$RUNNER_TEMP/avo-android" >> "$GITHUB_ENV"
          elif [ -f AVO_ANDROID_V1_2_ANALISIS_COMPLETO_FUENTES.zip ]; then
            mkdir -p "$RUNNER_TEMP/avo-android"
            unzip -q AVO_ANDROID_V1_2_ANALISIS_COMPLETO_FUENTES.zip -d "$RUNNER_TEMP/avo-android"
            echo "AVO_SOURCE_DIR=$RUNNER_TEMP/avo-android" >> "$GITHUB_ENV"
          elif [ -f AVO_ANDROID_V3_5_0_FUENTES_GITHUB.zip ]; then
            mkdir -p "$RUNNER_TEMP/avo-android"
            unzip -q AVO_ANDROID_V3_5_0_FUENTES_GITHUB.zip -d "$RUNNER_TEMP/avo-android"
            echo "AVO_SOURCE_DIR=$RUNNER_TEMP/avo-android" >> "$GITHUB_ENV"
          elif [ -f AVO_ANDROID_V1_1_FUENTES_PARA_GITHUB.zip ]; then
            mkdir -p "$RUNNER_TEMP/avo-android"
            unzip -q AVO_ANDROID_V1_1_FUENTES_PARA_GITHUB.zip -d "$RUNNER_TEMP/avo-android"
            echo "AVO_SOURCE_DIR=$RUNNER_TEMP/avo-android" >> "$GITHUB_ENV"
          elif [ -f AVO_ANDROID_V1_0_FUENTES_PARA_GITHUB.zip ]; then
            mkdir -p "$RUNNER_TEMP/avo-android"
            unzip -q AVO_ANDROID_V1_0_FUENTES_PARA_GITHUB.zip -d "$RUNNER_TEMP/avo-android"
            echo "AVO_SOURCE_DIR=$RUNNER_TEMP/avo-android" >> "$GITHUB_ENV"
          else
            echo "::error::Faltan las fuentes Android. Sube AVO_ANDROID_V1_0_FUENTES_PARA_GITHUB.zip a la raiz del repositorio."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 35
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle project
        shell: bash
        run: |
          test -d "$AVO_SOURCE_DIR/app"
          test -d "$AVO_SOURCE_DIR/core"
          test -f "$AVO_SOURCE_DIR/gradlew"
          test -f "$AVO_SOURCE_DIR/gradle/wrapper/gradle-wrapper.jar"
          chmod +x "$AVO_SOURCE_DIR/gradlew"

      - name: Run core unit tests
        shell: bash
        continue-on-error: true
        run: |
          cd "$AVO_SOURCE_DIR"
          ./gradlew --no-daemon :core:test

      - name: Build debug APK
        shell: bash
        run: |
          cd "$AVO_SOURCE_DIR"
          ./gradlew --no-daemon :app:assembleDebug

      - name: Prepare downloadable APK and SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          APK=$(find "$AVO_SOURCE_DIR/app/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/out/AVO_Performance_Horse_V1_5_OTA_Experimental_debug.apk"
          cd "$GITHUB_WORKSPACE/out"
          sha256sum AVO_Performance_Horse_V1_5_OTA_Experimental_debug.apk > AVO_Performance_Horse_V1_5_OTA_Experimental_debug.apk.sha256
          cat AVO_Performance_Horse_V1_5_OTA_Experimental_debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AVO-Performance-Horse-V1-5-OTA-Experimental-APK
          path: out/
          if-no-files-found: error
          retention-days: 30

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AVO-core-test-report
          path: ${{ env.AVO_SOURCE_DIR }}/core/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 14
