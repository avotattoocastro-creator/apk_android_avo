name: Build AVO Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
      - 'build.gradle'
      - 'build.gradle.kts'
      - 'settings.gradle'
      - 'settings.gradle.kts'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Verify Android project
        shell: bash
        run: |
          test -d app || { echo "::error::Falta app/. Subir primero el proyecto Android."; exit 1; }
          { test -f settings.gradle || test -f settings.gradle.kts; } || { echo "::error::Falta settings.gradle(.kts)."; exit 1; }
          { test -f build.gradle || test -f build.gradle.kts; } || { echo "::error::Falta build.gradle(.kts)."; exit 1; }

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile debug APK
        shell: bash
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon :app:assembleDebug
          else
            echo "::error::Falta Gradle Wrapper (gradlew). Inclúyelo en el proyecto para builds reproducibles."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AVO-Performance-Horse-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
