name: Build AVO Android APK
# V2.0: rediseño completo, mareas IHM y análisis de entrenamientos (2026-10-23).

on:
  workflow_dispatch:
  push:
    branches: [main, feature/android-v1-4-ota-pecho, feature/android-v1-9-nfc-segments, develop/avo-performance-horse, feature/avo-equine-intelligence-engine, feature/avo-nfc-identity, feature/avo-firebase-sync, feature/avo-wifi-sync, feature/avo-license-nfc]
    paths:
      - 'AVO_ANDROID_V1_0_FUENTES_PARA_GITHUB.zip'
      - 'AVO_ANDROID_V1_1_FUENTES_PARA_GITHUB.zip'
      - 'AVO_ANDROID_V3_5_0_FUENTES_GITHUB.zip'
      - 'AVO_ANDROID_V1_2_ANALISIS_COMPLETO_FUENTES.zip'
      - 'AVO_ANDROID_V1_3_DISPOSITIVOS_FUENTES.zip'
      - 'AVO_ANDROID_V1_4_OTA_PECHO_SEGURIDAD_FUENTES.zip'
      - 'AVO_ANDROID_V1_5_OTA_PECHO_EXPERIMENTAL_FUENTES.zip'
      - 'AVO_ANDROID_V1_6_OTA_SELECTOR_FIX_FUENTES.zip'
      - 'AVO_ANDROID_V1_7_OTA_DIAGNOSTICO_FUENTES.zip'
      - 'AVO_ANDROID_V1_8_BASE_FUENTES.zip'
      - 'AVO_ANDROID_V1_8_RECIBIR_WHATSAPP_FUENTES.zip'
      - 'AVO_ANDROID_V1_8_RECIBIR_WHATSAPP_FIX_COMPILACION.zip'
      - 'AVO_ANDROID_V1_8_SELECTOR_CABALLO_JINETE_FUENTES.zip'
      - 'AVO_ANDROID_V1_8_GRAFICAS_SINCRONIZADAS_FUENTES.zip'
      - 'AVO_ANDROID_V1_8_FAVORITOS_BASE_FUENTES.zip'
      - 'AVO_ANDROID_V1_8_BLE_RECOVERY_FUENTES.zip'
      - 'AVO_ANDROID_V1_8_BLE_RECOVERY_FUENTES.zip'
      - 'app/**'
      - 'cards/**'
      - 'equine-intelligence/**'
      - 'firmware/back/V3_8_0/lib/avo_core/**'
      - 'core/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
      - 'config/license_public_keys.txt'
      - 'build.gradle'
      - 'build.gradle.kts'
      - 'settings.gradle'
      - 'settings.gradle.kts'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f app/build.gradle.kts ] || [ -f app/build.gradle ]; then
            echo "AVO_SOURCE_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          elif [ -f AVO_ANDROID_V1_8_BLE_RECOVERY_FUENTES.zip ]; then
            mkdir -p "$RUNNER_TEMP/avo-android"
            unzip -q AVO_ANDROID_V1_8_BLE_RECOVERY_FUENTES.zip -d "$RUNNER_TEMP/avo-android"
            echo "AVO_SOURCE_DIR=$RUNNER_TEMP/avo-android" >> "$GITHUB_ENV"
          elif [ -f AVO_ANDROID_V1_8_BLE_RECOVERY_FUENTES.zip ]; then
            mkdir -p "$RUNNER_TEMP/avo-android"
            unzip -q AVO_ANDROID_V1_8_BLE_RECOVERY_FUENTES.zip -d "$RUNNER_TEMP/avo-android"
            echo "AVO_SOURCE_DIR=$RUNNER_TEMP/avo-android" >> "$GITHUB_ENV"
          elif [ -f AVO_ANDROID_V1_8_FAVORITOS_BASE_FUENTES.zip ]; then
            mkdir -p "$RUNNER_TEMP/avo-android"
            unzip -q AVO_ANDROID_V1_8_FAVORITOS_BASE_FUENTES.zip -d "$RUNNER_TEMP/avo-android"
            echo "AVO_SOURCE_DIR=$RUNNER_TEMP/avo-android" >> "$GITHUB_ENV"
          elif [ -f AVO_ANDROID_V1_8_GRAFICAS_SINCRONIZADAS_FUENTES.zip ]; then
            mkdir -p "$RUNNER_TEMP/avo-android"
            unzip -q AVO_ANDROID_V1_8_GRAFICAS_SINCRONIZADAS_FUENTES.zip -d "$RUNNER_TEMP/avo-android"
            echo "AVO_SOURCE_DIR=$RUNNER_TEMP/avo-android" >> "$GITHUB_ENV"
          elif [ -f AVO_ANDROID_V1_8_SELECTOR_CABALLO_JINETE_FUENTES.zip ]; then
            mkdir -p "$RUNNER_TEMP/avo-android"
            unzip -q AVO_ANDROID_V1_8_SELECTOR_CABALLO_JINETE_FUENTES.zip -d "$RUNNER_TEMP/avo-android"
            echo "AVO_SOURCE_DIR=$RUNNER_TEMP/avo-android" >> "$GITHUB_ENV"
          elif [ -f AVO_ANDROID_V1_8_RECIBIR_WHATSAPP_FIX_COMPILACION.zip ]; then
            mkdir -p "$RUNNER_TEMP/avo-android"
            unzip -q AVO_ANDROID_V1_8_RECIBIR_WHATSAPP_FIX_COMPILACION.zip -d "$RUNNER_TEMP/avo-android"
            echo "AVO_SOURCE_DIR=$RUNNER_TEMP/avo-android" >> "$GITHUB_ENV"
          elif [ -f AVO_ANDROID_V1_8_RECIBIR_WHATSAPP_FUENTES.zip ]; then
            mkdir -p "$RUNNER_TEMP/avo-android"
            unzip -q AVO_ANDROID_V1_8_RECIBIR_WHATSAPP_FUENTES.zip -d "$RUNNER_TEMP/avo-android"
            echo "AVO_SOURCE_DIR=$RUNNER_TEMP/avo-android" >> "$GITHUB_ENV"
          elif [ -f AVO_ANDROID_V1_8_BASE_FUENTES.zip ]; then
            mkdir -p "$RUNNER_TEMP/avo-android"
            unzip -q AVO_ANDROID_V1_8_BASE_FUENTES.zip -d "$RUNNER_TEMP/avo-android"
            echo "AVO_SOURCE_DIR=$RUNNER_TEMP/avo-android" >> "$GITHUB_ENV"
          elif [ -f AVO_ANDROID_V1_7_OTA_DIAGNOSTICO_FUENTES.zip ]; then
            mkdir -p "$RUNNER_TEMP/avo-android"
            unzip -q AVO_ANDROID_V1_7_OTA_DIAGNOSTICO_FUENTES.zip -d "$RUNNER_TEMP/avo-android"
            echo "AVO_SOURCE_DIR=$RUNNER_TEMP/avo-android" >> "$GITHUB_ENV"
          elif [ -f AVO_ANDROID_V1_6_OTA_SELECTOR_FIX_FUENTES.zip ]; then
            mkdir -p "$RUNNER_TEMP/avo-android"
            unzip -q AVO_ANDROID_V1_6_OTA_SELECTOR_FIX_FUENTES.zip -d "$RUNNER_TEMP/avo-android"
            echo "AVO_SOURCE_DIR=$RUNNER_TEMP/avo-android" >> "$GITHUB_ENV"
          elif [ -f AVO_ANDROID_V1_5_OTA_PECHO_EXPERIMENTAL_FUENTES.zip ]; then
            mkdir -p "$RUNNER_TEMP/avo-android"
            unzip -q AVO_ANDROID_V1_5_OTA_PECHO_EXPERIMENTAL_FUENTES.zip -d "$RUNNER_TEMP/avo-android"
            echo "AVO_SOURCE_DIR=$RUNNER_TEMP/avo-android" >> "$GITHUB_ENV"
          elif [ -f AVO_ANDROID_V1_4_OTA_PECHO_SEGURIDAD_FUENTES.zip ]; then
            mkdir -p "$RUNNER_TEMP/avo-android"
            unzip -q AVO_ANDROID_V1_4_OTA_PECHO_SEGURIDAD_FUENTES.zip -d "$RUNNER_TEMP/avo-android"
            echo "AVO_SOURCE_DIR=$RUNNER_TEMP/avo-android" >> "$GITHUB_ENV"
          elif [ -f AVO_ANDROID_V1_3_DISPOSITIVOS_FUENTES.zip ]; then
            mkdir -p "$RUNNER_TEMP/avo-android"
            unzip -q AVO_ANDROID_V1_3_DISPOSITIVOS_FUENTES.zip -d "$RUNNER_TEMP/avo-android"
            echo "AVO_SOURCE_DIR=$RUNNER_TEMP/avo-android" >> "$GITHUB_ENV"
          elif [ -f AVO_ANDROID_V1_2_ANALISIS_COMPLETO_FUENTES.zip ]; then
            mkdir -p "$RUNNER_TEMP/avo-android"
            unzip -q AVO_ANDROID_V1_2_ANALISIS_COMPLETO_FUENTES.zip -d "$RUNNER_TEMP/avo-android"
            echo "AVO_SOURCE_DIR=$RUNNER_TEMP/avo-android" >> "$GITHUB_ENV"
          elif [ -f AVO_ANDROID_V3_5_0_FUENTES_GITHUB.zip ]; then
            mkdir -p "$RUNNER_TEMP/avo-android"
            unzip -q AVO_ANDROID_V3_5_0_FUENTES_GITHUB.zip -d "$RUNNER_TEMP/avo-android"
            echo "AVO_SOURCE_DIR=$RUNNER_TEMP/avo-android" >> "$GITHUB_ENV"
          elif [ -f AVO_ANDROID_V1_1_FUENTES_PARA_GITHUB.zip ]; then
            mkdir -p "$RUNNER_TEMP/avo-android"
            unzip -q AVO_ANDROID_V1_1_FUENTES_PARA_GITHUB.zip -d "$RUNNER_TEMP/avo-android"
            echo "AVO_SOURCE_DIR=$RUNNER_TEMP/avo-android" >> "$GITHUB_ENV"
          elif [ -f AVO_ANDROID_V1_0_FUENTES_PARA_GITHUB.zip ]; then
            mkdir -p "$RUNNER_TEMP/avo-android"
            unzip -q AVO_ANDROID_V1_0_FUENTES_PARA_GITHUB.zip -d "$RUNNER_TEMP/avo-android"
            echo "AVO_SOURCE_DIR=$RUNNER_TEMP/avo-android" >> "$GITHUB_ENV"
          else
            echo "::error::Faltan las fuentes Android. Sube AVO_ANDROID_V1_0_FUENTES_PARA_GITHUB.zip a la raiz del repositorio."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 35
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle project
        shell: bash
        run: |
          test -d "$AVO_SOURCE_DIR/app"
          test -d "$AVO_SOURCE_DIR/core"
          test -f "$AVO_SOURCE_DIR/gradlew"
          test -f "$AVO_SOURCE_DIR/gradle/wrapper/gradle-wrapper.jar"
          chmod +x "$AVO_SOURCE_DIR/gradlew"

      - name: Run core unit tests
        shell: bash
        run: |
          cd "$AVO_SOURCE_DIR"
          set -o pipefail
          ./gradlew --no-daemon :core:test 2>&1 | tee "$RUNNER_TEMP/core.log" || {
            grep -E '^e: ' "$RUNNER_TEMP/core.log" | head -30 | sed -E 's#^e: (file://)?([^:]+):([0-9]+):([0-9]+) (.*)#::error file=\2,line=\3,col=\4::\5#' || true
            grep -E ' > .* FAILED$' -A3 "$RUNNER_TEMP/core.log" | head -40 | tr '\n' ' ' | sed 's/^/::error title=Prueba core::/' ; echo
            exit 1
          }

      - name: Resumen de pruebas JVM
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t = f = 0
          for x in glob.glob("${{ env.AVO_SOURCE_DIR }}/core/build/test-results/test/*.xml", recursive=True):
              r = ET.parse(x).getroot()
              for s in ([r] if r.tag == "testsuite" else r.iter("testsuite")):
                  t += int(s.get("tests", 0)); f += int(s.get("failures", 0)) + int(s.get("errors", 0))
          print(f"::notice::Pruebas core (incluye EquineResultTest): {t} pruebas, {f} fallos")
          PY
      - name: Verify Android JVM tests
        shell: bash
        run: |
          cd "$AVO_SOURCE_DIR"
          ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Stable signing key (secrets)
        env:
          AVO_KEYSTORE_BASE64: ${{ secrets.AVO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$AVO_KEYSTORE_BASE64" ]; then
            echo "$AVO_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/avo.jks"
            echo "AVO_KEYSTORE_FILE=$RUNNER_TEMP/avo.jks" >> "$GITHUB_ENV"
            echo "::notice::APK firmado con la clave estable AVO"
          else
            echo "::warning::Sin secreto AVO_KEYSTORE_BASE64: APK con clave debug temporal (requerirá desinstalar)"
          fi

      - name: App licence keys (variable AVO_LICENSE_PUBLIC_KEYS)
        env:
          AVO_LICENSE_PUBLIC_KEYS: ${{ vars.AVO_LICENSE_PUBLIC_KEYS }}
        shell: bash
        run: |
          if [ -z "$AVO_LICENSE_PUBLIC_KEYS" ] && [ -f config/license_public_keys.txt ]; then
            AVO_LICENSE_PUBLIC_KEYS=$(grep -v '^[[:space:]]*#' config/license_public_keys.txt | tr -s ' \t\r\n,;' '\n' | grep . || true)
          fi
          if [ -n "$AVO_LICENSE_PUBLIC_KEYS" ]; then
            n=$(echo "$AVO_LICENSE_PUBLIC_KEYS" | tr ',; ' '\n\n\n' | grep -c . || true)
            ids=$(echo "$AVO_LICENSE_PUBLIC_KEYS" | tr ',; ' '\n\n\n' | grep . | while read k; do echo "$k" | base64 -d | sha256sum | cut -c1-8 | tr a-f A-F; done | paste -sd' ')
            echo "::notice::Licencias ACTIVADAS: $n clave(s) pública(s) de AVO Tarjetas compiladas en la app (id: $ids)"
          else
            echo "::warning::Sin variable AVO_LICENSE_PUBLIC_KEYS: APK SIN control de licencias (versión de desarrollo)"
          fi

      - name: Build debug APK
        env:
          AVO_LICENSE_PUBLIC_KEYS: ${{ vars.AVO_LICENSE_PUBLIC_KEYS }}
          AVO_KEYSTORE_PASSWORD: ${{ secrets.AVO_KEYSTORE_PASSWORD }}
          AVO_KEY_ALIAS: ${{ secrets.AVO_KEY_ALIAS }}
          AVO_KEY_PASSWORD: ${{ secrets.AVO_KEY_PASSWORD }}
        shell: bash
        run: |
          cd "$AVO_SOURCE_DIR"
          set -o pipefail
          ./gradlew --no-daemon :app:assembleDebug :cards:assembleDebug 2>&1 | tee "$RUNNER_TEMP/build.log" || {
            grep -E '^e: ' "$RUNNER_TEMP/build.log" | head -40 | sed -E 's#^e: (file://)?([^:]+):([0-9]+):([0-9]+) (.*)#::error file=\2,line=\3,col=\4::\5#' || true
            exit 1
          }

      - name: Prepare downloadable APK and SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          APK=$(find "$AVO_SOURCE_DIR/app/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK"
          VERSION=$(grep -m1 'versionName' "$AVO_SOURCE_DIR/app/build.gradle.kts" | sed -E 's/.*"([^"]+)".*/\1/' | tr '.-' '__' | tr 'a-z' 'A-Z')
          CARDS_VERSION=$(grep -m1 'versionName' "$AVO_SOURCE_DIR/cards/build.gradle.kts" | sed -E 's/.*"([^"]+)".*/\1/' | tr '.-' '__' | tr 'a-z' 'A-Z')
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          # the APK must contain the engine for every supported ABI
          for abi in arm64-v8a armeabi-v7a x86_64; do unzip -l "$APK" | grep -q "lib/$abi/libavo_equine_jni.so" || { echo "::error::falta libavo_equine_jni.so para $abi"; exit 1; }; done
          OUTPUT="AVO_Performance_Horse_V${VERSION}_debug.apk"
          cp "$APK" "$GITHUB_WORKSPACE/out/$OUTPUT"
          CARDS=$(find "$AVO_SOURCE_DIR/cards/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' -print -quit 2>/dev/null || true)
          if [ -n "$CARDS" ]; then C="AVO_Tarjetas_V${CARDS_VERSION}_debug.apk"; cp "$CARDS" "$GITHUB_WORKSPACE/out/$C"; (cd "$GITHUB_WORKSPACE/out" && sha256sum "$C" > "$C.sha256"); fi
          cd "$GITHUB_WORKSPACE/out"
          sha256sum "$OUTPUT" > "$OUTPUT.sha256"
          cat "$OUTPUT.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AVO-Performance-Horse-V${{ env.APP_VERSION }}-APK
          path: out/
          if-no-files-found: error
          retention-days: 30

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AVO-core-test-report
          path: ${{ env.AVO_SOURCE_DIR }}/core/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 14

  # RAW -> JNI -> C++ engine -> Kotlin model on a real Android runtime (x86_64 emulator).
  android-device-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v4
        with: { packages: 'platform-tools' }
      - name: SDK, NDK y CMake
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Pruebas instrumentadas en emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            chmod +x gradlew
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Resumen de pruebas instrumentadas
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t = f = 0
          for x in glob.glob("app/build/outputs/androidTest-results/connected/**/*.xml", recursive=True):
              r = ET.parse(x).getroot()
              for s in ([r] if r.tag == "testsuite" else r.iter("testsuite")):
                  t += int(s.get("tests", 0)); f += int(s.get("failures", 0)) + int(s.get("errors", 0))
          print(f"::notice::Pruebas en emulador (RAW -> JNI -> motor -> Kotlin): {t} pruebas, {f} fallos")
          PY
      - name: Informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AVO-device-test-report
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore
