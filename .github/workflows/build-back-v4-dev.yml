name: Build AVO BACK V4.0.0-dev (Heltec + ZED-F9P, máxima precisión RTK)

on:
  workflow_dispatch:
  push:
    branches: [feature/avo-measurement-engine-v4]
    paths:
      - 'firmware/back/V4_0_0_DEV/**'
      - '.github/workflows/build-back-v4-dev.yml'

permissions:
  contents: read

jobs:
  back:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: firmware/back/V4_0_0_DEV
    steps:
      - uses: actions/checkout@v4

      - name: Host tests (ESP-NOW link, pairing, simulated ZED-F9P, precision profile)
        run: |
          g++ -std=c++17 -O1 -g -Wall -fsanitize=address,undefined -fno-sanitize-recover=all -Ilib/avo_core/src test/test_espnow.cpp lib/avo_core/src/*.cpp -o back_test
          ./back_test

      - name: Fuzz decoders (ASan + UBSan, 1 000 000 entradas)
        run: |
          g++ -std=c++17 -O1 -g -DAVO_FUZZ_STANDALONE -fsanitize=address,undefined -fno-sanitize-recover=all -Ilib/avo_core/src test/fuzz_decoders.cpp lib/avo_core/src/*.cpp -o fuzz
          ./fuzz 1000000

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core 3.3.12 (same as the installed back firmware, ESP-IDF 5.5.5)
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Build firmware
        run: ./build_back.sh "$GITHUB_WORKSPACE/out"

      - name: Package
        run: |
          cd "$GITHUB_WORKSPACE/out"
          ls -la
          BIN=$(ls AVO_BACK_V4_0_0_DEV.ino.bin)
          cp "$BIN" AVO_BACK_V4_0_0_DEV_firmware.bin
          [ -f AVO_BACK_V4_0_0_DEV.ino.merged.bin ] && cp AVO_BACK_V4_0_0_DEV.ino.merged.bin AVO_BACK_V4_0_0_DEV_COMPLETO_0x0.bin || true
          sha256sum AVO_BACK_V4_0_0_DEV_*.bin > SHA256SUMS.txt
          cat SHA256SUMS.txt
          python3 - <<'PY'
          import struct
          b = open("AVO_BACK_V4_0_0_DEV_firmware.bin", "rb").read()
          assert b[0] == 0xE9 and struct.unpack("<H", b[12:14])[0] == 9, "not an ESP32-S3 app image"
          assert struct.unpack("<I", b[0x20:0x24])[0] == 0xABCD5432, "no esp_app_desc_t"
          assert len(b) < 3264 * 1024, "does not fit app0/app1 (3264 KB)"
          missing = [s for s in (b"4.0.0-dev1\x00AVO-BACK", b"AJUSTE_PRECISION", b"PRECISION: perfil") if s not in b]
          if missing: print(f"::error title=Imagen::faltan {missing}"); raise SystemExit(1)
          print(f"::notice title=AVO BACK 4.0.0-dev1::imagen ESP32-S3 valida, {len(b)} bytes ({len(b)*100//(3264*1024)} % de app0), esp_app_desc OK, version 4.0.0-dev1 y marcador AVO-BACK presentes")
          PY
          echo "::notice title=Memoria::$(grep -E 'Sketch uses|Global variables' build.log | tr '\n' ' ')"

      - uses: actions/upload-artifact@v4
        with:
          name: AVO-BACK-V4-0-0-DEV-HELTEC
          path: |
            out/AVO_BACK_V4_0_0_DEV_*.bin
            out/SHA256SUMS.txt
            out/build.log
          if-no-files-found: error
          retention-days: 60
